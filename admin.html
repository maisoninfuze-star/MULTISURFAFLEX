<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Demandes — Multisurfaflex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Instrument+Sans:wdth,wght@75..100,400..700&family=Martian+Mono:wght@300..600&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#FFFFFF; --surface:#F4F8FB; --sunk:#E9F1F7;
  --ink:#0F2437; --ink-2:#48607A; --ink-3:#77889A;
  --line:#DDE7EF; --line-2:#C3D4E0;
  --terra:#0064AD; --terra-deep:#005187;
  --lime:#80CE48; --lime-ink:#457A1E;
  --warn:#B4341F;
  --f-h:"Bricolage Grotesque",system-ui,sans-serif;
  --f-b:"Instrument Sans",system-ui,sans-serif;
  --f-m:"Martian Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--surface); color:var(--ink); font-family:var(--f-b); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1180px; margin:0 auto; padding:0 20px}
.m{font-family:var(--f-m); font-size:10.5px; letter-spacing:.09em; text-transform:uppercase}

/* ── top bar ── */
.bar{position:sticky; top:0; z-index:20; background:var(--ground); border-bottom:1px solid var(--line)}
.bar-in{display:flex; gap:14px; align-items:center; min-height:62px; flex-wrap:wrap}
.bar h1{margin:0; font-family:var(--f-h); font-size:19px; font-weight:800; font-variation-settings:"wdth" 100}
.bar .tag{font-family:var(--f-m); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase;
  background:var(--sunk); color:var(--ink-2); padding:4px 9px; border-radius:2px}
.spacer{flex:1 1 auto}
button{font:inherit; cursor:pointer}
.btn{font-family:var(--f-m); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase;
  padding:9px 15px; border-radius:3px; border:1px solid var(--line-2); background:var(--ground); color:var(--ink);
  min-height:40px; transition:border-color .15s, background .15s}
.btn:hover{border-color:var(--terra); color:var(--terra-deep)}
.btn.pri{background:var(--terra-deep); border-color:var(--terra-deep); color:#fff}
.btn.pri:hover{background:var(--terra); border-color:var(--terra); color:#fff}
.btn.ghost{border-color:transparent; color:var(--ink-3)}
.btn.ghost:hover{color:var(--warn); border-color:transparent}
.btn[disabled]{opacity:.5; cursor:default}

/* ── gate ── */
.gate{max-width:560px; margin:9vh auto; background:var(--ground); border:1px solid var(--line); border-radius:4px;
  padding:clamp(24px,4vw,38px)}
.gate h2{margin:12px 0 6px; font-family:var(--f-h); font-size:25px; font-weight:800}
.gate p{margin:0 0 16px; color:var(--ink-2); font-size:14.5px}
.gate ol{margin:0 0 18px; padding-left:19px; color:var(--ink-2); font-size:14px; line-height:1.65}
.gate code{font-family:var(--f-m); font-size:12px; background:var(--sunk); padding:2px 6px; border-radius:2px}
input[type=password],input[type=text],input[type=search]{
  width:100%; font:inherit; padding:11px 13px; border:1px solid var(--line-2); border-radius:3px;
  background:var(--ground); color:var(--ink); min-height:44px}
input:focus{outline:2px solid var(--terra); outline-offset:1px; border-color:var(--terra)}
.note{font-size:13px; color:var(--ink-3); margin-top:12px; line-height:1.55}

/* ── toolbar ── */
.tools{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:20px 0 16px}
.tools input[type=search]{max-width:300px}
.chip{font-family:var(--f-m); font-size:10px; letter-spacing:.07em; text-transform:uppercase;
  padding:8px 12px; border-radius:999px; border:1px solid var(--line-2); background:var(--ground); color:var(--ink-2)}
.chip[aria-pressed=true]{background:var(--ink); border-color:var(--ink); color:#fff}
.count{font-family:var(--f-m); font-size:11px; color:var(--ink-3)}

/* ── cards ── */
.list{display:grid; gap:12px; padding-bottom:60px}
.card{background:var(--ground); border:1px solid var(--line); border-radius:4px; padding:16px 18px;
  display:grid; gap:12px}
.card.fresh{border-left:3px solid var(--lime)}
.c-top{display:flex; gap:12px; align-items:baseline; flex-wrap:wrap}
.c-name{font-family:var(--f-h); font-size:18px; font-weight:800; margin:0}
.c-when{font-family:var(--f-m); font-size:10px; color:var(--ink-3); letter-spacing:.06em; text-transform:uppercase}
.c-new{font-family:var(--f-m); font-size:9px; letter-spacing:.1em; text-transform:uppercase;
  background:var(--lime); color:var(--ink); padding:3px 8px; border-radius:2px}
.c-act{display:flex; gap:8px; flex-wrap:wrap}
.c-act a{display:inline-flex; align-items:center; gap:7px; text-decoration:none; min-height:42px; padding:0 15px;
  border-radius:3px; font-family:var(--f-m); font-size:11px; letter-spacing:.06em; text-transform:uppercase;
  border:1px solid var(--line-2); color:var(--ink)}
.c-act a.call{background:var(--terra-deep); border-color:var(--terra-deep); color:#fff}
.c-act a:hover{border-color:var(--terra)}
.c-act a.call:hover{background:var(--terra)}
.facts{display:grid; gap:8px 22px; grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  border-top:1px solid var(--line); padding-top:12px}
.fact{display:grid; gap:2px}
.fact dt{font-family:var(--f-m); font-size:9.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3)}
.fact dd{margin:0; font-size:14.5px; color:var(--ink)}
.fact dd.lang{font-weight:600; color:var(--terra-deep)}
.notes{border-top:1px solid var(--line); padding-top:12px}
.notes p{margin:0; font-size:14.5px; color:var(--ink-2); white-space:pre-wrap}
.empty,.err{background:var(--ground); border:1px solid var(--line); border-radius:4px; padding:30px; text-align:center;
  color:var(--ink-2)}
.err{border-color:#E8BDB3; background:#FDF5F3; color:var(--warn); text-align:left; white-space:pre-wrap;
  font-family:var(--f-m); font-size:12px; line-height:1.6}
.hide{display:none !important}
@media(max-width:640px){
  .c-act{display:grid; grid-template-columns:1fr 1fr}
  .c-act a{justify-content:center}
}
</style>
</head>
<body>

<!-- ══ gate: no token, nothing is fetched ══ -->
<section id="gate" class="gate">
  <p class="m" style="color:var(--terra)">Multisurfaflex · Interne</p>
  <h2>Demandes de soumission</h2>
  <p>Toutes les demandes envoyées par le formulaire du site, en un seul endroit. Indépendant des courriels.</p>
  <label>
    <span class="m" style="display:block; margin-bottom:6px; color:var(--ink-2)">Mot de passe</span>
    <input id="tok" type="password" autocomplete="current-password" spellcheck="false" placeholder="••••••••">
  </label>
  <p class="note">Le mot de passe reste dans ce navigateur. Sur un ordinateur partagé, utilisez « Oublier » en partant.</p>
  <p style="margin:18px 0 0"><button class="btn pri" id="go">Voir les demandes</button></p>
  <div id="gateErr" class="err hide" style="margin-top:16px"></div>
</section>

<!-- ══ app ══ -->
<div id="app" class="hide">
  <div class="bar">
    <div class="wrap bar-in">
      <h1>Demandes</h1>
      <span class="tag" id="loc">Multisurfaflex</span>
      <span class="spacer"></span>
      <span class="count" id="count"></span>
      <button class="btn" id="refresh">Actualiser</button>
      <button class="btn ghost" id="forget">Oublier</button>
    </div>
  </div>

  <div class="wrap">
    <div class="tools">
      <input type="search" id="q" placeholder="Chercher un nom, un téléphone, une ville…" aria-label="Chercher">
      <button class="chip" id="fNew" aria-pressed="false">7 derniers jours</button>
      <button class="chip" id="fPhone" aria-pressed="false">Avec téléphone</button>
    </div>
    <div id="err" class="err hide"></div>
    <div id="list" class="list"></div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var KEY = "msf_admin_pw";
  var $ = function(id){ return document.getElementById(id); };
  var state = { pw:"", rows:[], onlyNew:false, onlyPhone:false, q:"" };

  function fetchRequests(pw){
    return fetch("/api/requests", { headers:{ "x-admin-password": pw }, cache:"no-store" })
      .then(function(r){
        return r.text().then(function(t){
          var j = null; try { j = JSON.parse(t); } catch(e){}
          if(!r.ok) throw new Error((j && j.error) || ("HTTP " + r.status));
          return (j && j.requests) || [];
        });
      });
  }

  function esc(s){ return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

  function ago(iso){
    var t = Date.parse(iso); if(isNaN(t)) return "";
    var mins = Math.round((Date.now() - t) / 60000);
    if(mins < 2) return "à l’instant";
    if(mins < 60) return "il y a " + mins + " min";
    var h = Math.round(mins/60); if(h < 24) return "il y a " + h + " h";
    var d = Math.round(h/24); if(d < 31) return "il y a " + d + " j";
    return new Date(t).toLocaleDateString("fr-CA");
  }

  function tel(p){ return "tel:" + String(p||"").replace(/[^0-9+]/g,""); }

  function card(c){
    var when  = c.received_at || c.submitted_at;
    var fresh = when && (Date.now() - Date.parse(when)) < 7*864e5;
    var facts = [
      ["Service",    c.application],
      ["Superficie", c.area_sqft ? c.area_sqft + " pi²" : ""],
      ["Couleur",    c.colour],
      ["Ville",      c.city],
      ["Langue",     c.language],
      ["Page",       c.page]
    ].filter(function(f){ return f[1]; });

    var acts = "";
    if(c.phone) acts += '<a class="call" href="'+esc(tel(c.phone))+'">Appeler '+esc(c.phone)+'</a>';
    if(c.email) acts += '<a href="mailto:'+esc(c.email)+'">Courriel</a>';

    /* if the CRM hand-off failed, say so on the card — the lead is safe here
       but it will not be in GoHighLevel */
    var warn = c.forwarded_to_crm === false
      ? '<div class="notes"><p style="color:var(--warn)">⚠ Non transmis au CRM'
        + (c.crm_error ? " (" + esc(c.crm_error) + ")" : "") + '. La demande est conservée ici.</p></div>'
      : "";

    return '<article class="card'+(fresh?" fresh":"")+'">'
      + '<div class="c-top"><h2 class="c-name">'+esc(c.name || "—")+'</h2>'
      + (fresh ? '<span class="c-new">Nouveau</span>' : "")
      + '<span class="spacer"></span><span class="c-when">'+esc(ago(when))+'</span></div>'
      + (acts ? '<div class="c-act">'+acts+'</div>' : "")
      + (facts.length ? '<dl class="facts">' + facts.map(function(f){
            var cls = f[0] === "Langue" ? ' class="lang"' : "";
            return '<div class="fact"><dt>'+esc(f[0])+'</dt><dd'+cls+'>'+esc(f[1])+'</dd></div>';
          }).join("") + '</dl>' : "")
      + (c.notes ? '<div class="notes"><p>'+esc(c.notes)+'</p></div>' : "")
      + warn
      + '</article>';
  }

  function visible(){
    var q = state.q.trim().toLowerCase();
    return state.rows.filter(function(c){
      if(state.onlyPhone && !c.phone) return false;
      if(state.onlyNew){
        var t = Date.parse(c.received_at || c.submitted_at || 0);
        if(isNaN(t) || Date.now() - t > 7*864e5) return false;
      }
      if(!q) return true;
      return [c.name,c.email,c.phone,c.city,c.application,c.colour,c.notes]
        .filter(Boolean).join(" ").toLowerCase().indexOf(q) > -1;
    });
  }

  function render(){
    /* a successful render always clears a previous failure — otherwise a stale
       banner sits above good results and the owner distrusts both */
    $("err").classList.add("hide");
    var rows = visible();
    $("count").textContent = rows.length + " / " + state.rows.length + " demande" + (state.rows.length>1?"s":"");
    $("list").innerHTML = rows.length
      ? rows.map(card).join("")
      : '<div class="empty">Aucune demande pour l’instant.</div>';
  }

  function fail(where, e){
    var el = $(where);
    el.textContent = "Échec : " + e.message;
    el.classList.remove("hide");
  }

  function boot(){
    $("err").classList.add("hide");
    $("refresh").disabled = true; $("refresh").textContent = "…";
    return fetchRequests(state.pw)
      .then(function(rows){ state.rows = rows; render(); })
      .catch(function(e){ fail("err", e); })
      .then(function(){ $("refresh").disabled = false; $("refresh").textContent = "Actualiser"; });
  }

  $("go").addEventListener("click", function(){
    var t = $("tok").value.trim();
    if(!t){ $("tok").focus(); return; }
    $("gateErr").classList.add("hide");
    $("go").disabled = true; $("go").textContent = "Vérification…";
    fetchRequests(t)
      .then(function(rows){
        state.pw = t; state.rows = rows;
        try { localStorage.setItem(KEY, t); } catch(e){}
        $("gate").classList.add("hide"); $("app").classList.remove("hide");
        render();
      })
      .catch(function(e){ fail("gateErr", e); })
      .then(function(){ $("go").disabled = false; $("go").textContent = "Voir les demandes"; });
  });
  $("tok").addEventListener("keydown", function(e){ if(e.key === "Enter") $("go").click(); });

  $("refresh").addEventListener("click", boot);
  $("forget").addEventListener("click", function(){
    try { localStorage.removeItem(KEY); } catch(e){}
    location.reload();
  });
  $("q").addEventListener("input", function(e){ state.q = e.target.value; render(); });
  function toggle(id, key){
    $(id).addEventListener("click", function(){
      state[key] = !state[key];
      $(id).setAttribute("aria-pressed", String(state[key]));
      render();
    });
  }
  toggle("fNew","onlyNew"); toggle("fPhone","onlyPhone");

  /* returning visit on the same browser */
  var saved = null; try { saved = localStorage.getItem(KEY); } catch(e){}
  if(saved){
    state.pw = saved;
    $("gate").classList.add("hide"); $("app").classList.remove("hide");
    boot();
  }
})();
</script>
</body>
</html>
